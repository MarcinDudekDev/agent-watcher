[project]
name = "shiftlog"
version = "0.3.0"
description = "Summarise plain-text timesheets."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
shiftlog = "shiftlog.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
